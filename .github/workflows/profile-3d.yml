# Generates a 3D isometric contribution calendar SVG into profile-3d-contrib/
name: GitHub Profile 3D Contrib
on:
  push:
    branches: [main]
    paths: [".github/workflows/profile-3d.yml"]
  schedule: [{ cron: "30 18 * * *" }]   # daily, 00:00 IST
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          git commit -m "chore: update 3D contribution graph" || exit 0
          git push
